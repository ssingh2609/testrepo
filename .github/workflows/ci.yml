name: CI

# Run this on every push to any branch, and on every pull request.
# The "on: pull_request" line is what attaches the check to your PR.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # grab your code
      - uses: actions/setup-node@v4        # install Node
        with:
          node-version: 20
      - run: npm ci                        # install dependencies
      - run: npm test                      # run the tests = "the check"
